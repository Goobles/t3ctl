name: release

# release-please watches main, derives the next version from Conventional
# Commits, and maintains a release PR. Merging that PR creates the tag and
# GitHub release, which is what actually triggers a publish.
on:
  push:
    branches: ["main"]
  # A stage can be rejected, or expire, after the GitHub release already exists.
  # release-please then reports release_created=false forever, so a rerun can
  # never re-stage. This is the manual path back.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to stage, e.g. v0.4.0"
        required: true
        type: string

permissions: {}

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release branch, tag and GitHub release
      pull-requests: write # open and groom the release PR
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          release-type: node

  # Separate job so publish rights never coexist with contents:write, and so a
  # tag created by GITHUB_TOKEN still reaches this step — a tag push alone would
  # not trigger a second workflow.
  stage:
    needs: release-please
    # always() so a skipped release-please (manual dispatch) does not skip this.
    if: |
      always() && (
        needs.release-please.outputs.release_created == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}

    # Trust boundary. npm's trusted publisher pins this workflow filename AND
    # this environment; add required reviewers here to gate on a human.
    environment:
      name: release
      url: https://www.npmjs.com/package/@gobius/t3ctl

    permissions:
      contents: read
      id-token: write # mint the short-lived OIDC token npm verifies

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Verify tag matches package.json
        run: |
          tag="${TAG#v}"
          pkg="$(node -p 'require("./package.json").version')"
          echo "tag=$tag package.json=$pkg"
          [ "$tag" = "$pkg" ] || { echo "::error::tag v$tag does not match package.json $pkg"; exit 1; }

      # t3ctl now has a runtime dependency, so it cannot even start without an
      # install. Note `node t3ctl.mjs | head -1` would NOT catch that: the pipe
      # masks the exit code and the step would pass while broken.
      - name: Install
        run: npm ci --ignore-scripts

      # tsc typechecks as it emits, so this is the typecheck too.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Stages only. The trusted publisher is stage-only, so this cannot make a
      # version public — a maintainer approves it with 2FA on npmjs.com or via
      # `npm stage approve`. release-please only emits stable semver, so there
      # is no prerelease dist-tag to special-case.
      - name: Stage release
        run: |
          echo "staging $(node -p 'require("./package.json").version')"
          npm stage publish . --provenance --tag latest --ignore-scripts

      - name: Promote instructions
        run: |
          {
            echo "### Staged — awaiting approval"
            echo ""
            echo "Approve on [npmjs.com](https://www.npmjs.com/package/@gobius/t3ctl) under **Staged Packages**, or:"
            echo '```'
            echo "npm stage list @gobius/t3ctl"
            echo "npm stage approve <stage-id>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
