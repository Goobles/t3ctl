name: ci

on:
  pull_request:
  push:
    branches: ["main"]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # package.json declares engines.node >= 22, so prove both ends of that
        # claim rather than only whatever the release job happens to use.
        node: ["22", "24"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: CLI runs and prints help
        run: |
          out="$(node dist/t3ctl.js --help)"
          echo "$out"
          echo "$out" | grep -q 'Commands:' || { echo "::error::help output missing command list"; exit 1; }

      - name: --version matches package.json
        run: |
          v="$(node dist/t3ctl.js --version)"
          pkg="$(node -p 'require("./package.json").version')"
          echo "cli=$v package.json=$pkg"
          [ "$v" = "$pkg" ] || { echo "::error::--version ($v) != package.json ($pkg)"; exit 1; }

      # commander owns argument validation now; assert it actually rejects bad
      # input rather than trusting it to. Each of these must exit non-zero.
      - name: Rejects bad input
        run: |
          fail() { echo "::error::expected failure: $*"; exit 1; }
          node dist/t3ctl.js thread send      >/dev/null 2>&1 && fail "thread send with no args"
          node dist/t3ctl.js thread rename    >/dev/null 2>&1 && fail "thread rename with no args"
          node dist/t3ctl.js host add         >/dev/null 2>&1 && fail "host add with no args"
          node dist/t3ctl.js project create   >/dev/null 2>&1 && fail "project create with no args"
          node dist/t3ctl.js bogus            >/dev/null 2>&1 && fail "unknown command"
          node dist/t3ctl.js ls --nope        >/dev/null 2>&1 && fail "unknown option"
          echo "all rejected correctly"

      - name: Per-command help exists
        run: |
          for c in "ls" "host add" "thread send" "thread retitle"; do
            node dist/t3ctl.js $c --help >/dev/null 2>&1 || { echo "::error::no help for: $c"; exit 1; }
          done
          echo "per-command help ok"

      - name: Package is publishable
        run: npm pack --dry-run

      # The release job enforces this too, but catching it on the PR means a bad
      # version never reaches a tag in the first place.
      - name: bin target exists and is executable
        run: |
          bin="$(node -p 'require("./package.json").bin.t3ctl')"
          test -f "$bin" || { echo "::error::bin target $bin missing"; exit 1; }
          head -1 "$bin" | grep -q '^#!/usr/bin/env node' || { echo "::error::$bin missing shebang"; exit 1; }
