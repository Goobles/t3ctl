name: ci

on:
  pull_request:
  push:
    branches: ["main"]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # package.json declares engines.node >= 22, so prove both ends of that
        # claim rather than only whatever the release job happens to use.
        node: ["22", "24"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        run: npm ci --ignore-scripts

      # tsc typechecks as it emits, so this is the typecheck too.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test
